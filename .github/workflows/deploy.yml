name: Permaweb Deploy

# One workflow, one deploy per push. There used to be a second, byte-identical
# workflow (deploy-undername.yml) with the same job name and trigger, so every
# push ran two full deploys against the same record and occasionally raced.
on:
  push:
    branches:
      - master
  # Uploading is safe to do by hand: it never touches the ArNS record, it only
  # produces a manifest id.
  workflow_dispatch:

# A second push while a deploy is in flight should supersede it, not race it.
concurrency:
  group: permaweb-deploy
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      VITE_GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly the lockfile, unlike `npm install`, which was
      # free to resolve different versions than the ones this was tested against.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: npx tsc -b

      - name: Build
        run: npm run build

      # Fail before signing anything if the wallet cannot pay.
      - name: Preflight Turbo credits
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: npm run deploy:check

      # Uploads only files whose bytes are not already on Arweave. The reuse
      # index is recovered from the gateway, so a fresh runner with no cache
      # still avoids re-paying for unchanged chunks.
      - name: Upload to permaweb
        id: upload
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: node scripts/deploy-site.mjs

      # `rewind` is a Solana ANT now, so an Arweave JWK cannot update the name.
      # The manifest id is surfaced here for an operator to link by hand.
      - name: Manifest id
        run: |
          echo "Manifest: ${{ steps.upload.outputs.manifest_id }}"
          echo "Link this id to the Solana ANT to publish it."
